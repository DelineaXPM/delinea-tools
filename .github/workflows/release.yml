name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, format: tar.gz }
          - { goos: linux, goarch: arm64, format: tar.gz }
          - { goos: darwin, goarch: amd64, format: tar.gz }
          - { goos: darwin, goarch: arm64, format: tar.gz }
          - { goos: windows, goarch: amd64, format: zip }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: require the release tag at main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: ./.github/actions/setup-common
        with:
          deploy-key: ${{ secrets.DELINEA_COMMON_DEPLOY_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build the tagged module
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOBIN: ${{ runner.temp }}/bin
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf https://github.com/
          go install "github.com/DelineaXPM/delinea-tools/cmd/delinea-util@${GITHUB_REF_NAME}"
          binary="$GOBIN/delinea-util"
          if [ "${GOOS}" = windows ]; then binary="${binary}.exe"; fi
          go version -m "$binary" | grep -F $'mod\tgithub.com/DelineaXPM/delinea-tools\t'"${GITHUB_REF_NAME}"
          package="delinea-util_${GITHUB_REF_NAME#v}_${GOOS}_${GOARCH}"
          mkdir -p "stage/$package" dist
          cp "$binary" LICENSE README.md "stage/$package/"
          if [ "${{ matrix.format }}" = zip ]; then
            (cd stage && zip -q -r "../dist/${package}.zip" "$package")
          else
            tar -C stage -czf "dist/${package}.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delinea-util-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
