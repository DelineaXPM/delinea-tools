name: quality

on:
  schedule:
    - cron: "43 5 * * 3" # Wednesdays 05:43 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: shuffled repeated suite
        run: go test -shuffle=on -count=10 ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./api
            target: FuzzRetryDelay
          - package: ./api
            target: FuzzValidateVaultURL
          - package: ./api
            target: FuzzValidateGrant
          - package: ./cmd/delinea-util
            target: FuzzParseArgs
          - package: ./cmd/delinea-util
            target: FuzzParseHeaders
          - package: ./cmd/delinea-util
            target: FuzzReadSecretStdin
          - package: ./secrets
            target: FuzzParseMapping
          - package: ./secrets/retrievejson
            target: FuzzParse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.target }}
        run: go test "${{ matrix.package }}" -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s
