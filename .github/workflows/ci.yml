name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      # The race build runs every test, so a separate plain run would repeat
      # the whole suite for nothing.
      - name: test (race)
        run: go test -race ./...
      - name: coverage floor
        if: runner.os == 'Linux'
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ { seen=1; gsub(/%/, "", $3); print "total coverage: " $3 "%"; if ($3 + 0 < 88.0) exit 1 } END { if (!seen) { print "coverage gate: no total: line from go tool cover"; exit 1 } }'
      # The live suites skip cleanly without DELINEA_TOOLS_TEST_* fixtures, so this
      # proves the e2e build compiles and its skip guards hold.
      - name: e2e build (skips without fixtures)
        run: go test -tags e2e ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build all target platforms
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=linux   GOARCH=arm64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # govulncheck uses the go command on PATH as the standard-library version
      # under analysis. Scan the minimum version consumers may use, so a fixed
      # security release keeps this job red until go.mod advances to that release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The zero-third-party-dependency invariant is also asserted by an offline
  # test (internal/supplychain) that runs in the cross-platform test job. This
  # job adds the part a test cannot see: that go.mod is exactly what `go mod
  # tidy` would produce and that no go.sum has appeared, so no stale, unused, or
  # third-party directive can accumulate.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go.mod is tidy and dependency-free
        run: |
          cp go.mod go.mod.orig
          go mod tidy
          diff -u go.mod.orig go.mod || { echo 'go.mod is not tidy; run: go mod tidy'; exit 1; }
          rm -f go.mod.orig
          test ! -e go.sum || { echo 'go.sum exists: this module must have no third-party dependencies'; exit 1; }
