name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      # The race build runs every test, so a separate plain run would repeat
      # the whole suite for nothing.
      - name: test (race)
        run: go test -race ./...
      - name: coverage floor
        if: runner.os == 'Linux'
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ { seen=1; gsub(/%/, "", $3); print "total coverage: " $3 "%"; if ($3 + 0 < 88.0) exit 1 } END { if (!seen) { print "coverage gate: no total: line from go tool cover"; exit 1 } }'
      # The live suites skip cleanly without DELINEA_TOOLS_TEST_* fixtures, so this
      # proves the e2e build compiles and its skip guards hold.
      - name: e2e build (skips without fixtures)
        run: go test -tags e2e ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: build all target platforms
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=linux   GOARCH=arm64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
